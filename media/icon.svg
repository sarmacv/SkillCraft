<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SkillCraft">
  <title>SkillCraft</title>
  <rect width="128" height="128" rx="28" fill="#04342C"/>
  <!-- Cut-gem facets, lit from the top left -->
  <polygon points="64,64 64,22 100.4,43" fill="#5DCAA5"/>
  <polygon points="64,64 100.4,43 100.4,85" fill="#1D9E75"/>
  <polygon points="64,64 100.4,85 64,106" fill="#0F6E56"/>
  <polygon points="64,64 64,106 27.6,85" fill="#085041"/>
  <polygon points="64,64 27.6,85 27.6,43" fill="#0F6E56"/>
  <polygon points="64,64 27.6,43 64,22" fill="#9FE1CB"/>
  <polygon points="64,22 100.4,43 100.4,85 64,106 27.6,85 27.6,43" fill="none" stroke="#E1F5EE" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Orchestration: entry, sources and outputs meeting at the skill -->
  <g stroke="#04342C" stroke-width="4" stroke-linecap="round">
    <line x1="64" y1="64" x2="64" y2="22"/>
    <line x1="64" y1="64" x2="100.4" y2="85"/>
    <line x1="64" y1="64" x2="27.6" y2="85"/>
  </g>
  <g fill="#E1F5EE" stroke="#04342C" stroke-width="3">
    <circle cx="64" cy="22" r="7.5"/>
    <circle cx="100.4" cy="85" r="7.5"/>
    <circle cx="27.6" cy="85" r="7.5"/>
  </g>
  <circle cx="64" cy="64" r="11" fill="#FAC775" stroke="#04342C" stroke-width="3.5"/>
</svg>
